# AGX 挖掘机配置（仿真适配器）—— 与具体任务无关。
#
# 只描述"这台仿真机器"：后端接什么、有哪些关节、能走多快、挖掘包络多大。
# 任务由运行时 --query 给出（如"把左边土堆挖两斗倒到右边"）。
#
# backend 三选一：
#   mock      —— 内存模拟，零依赖，离线开发/测试（默认）
#   inprocess —— 本进程 import agx 直接驱动场景（需 AGX Python 环境；阶段B）
#   remote    —— TCP 桥接 scripts/agx_bridge_server.py（跑在 AGX 自带 Python 里）
#
# joint_limits / 关键帧 / 可达包络：mock 后端下是占位默认值；接**真 AGX** 必须
# 换成实测值（见下面 "接真 AGX" 注释块，数值来自探针实测 + AGX 官方挖掘循环）。
# 不想让本机改动出现在 git status 里，可复制成 agx_excavator.local.yaml 再改
# （.gitignore 忽略 *.local.yaml），--config 指向该副本即可。

adapter: agx_excavator

env:
  cfg:
    low_level:
      backend: "mock"
      # scene_path: "scene/excavator.agx"     # [仅 inprocess] 场景文件
      # host: "127.0.0.1"                     # [仅 remote] 桥接服务地址
      # port: 9700                            # [仅 remote] 桥接服务端口
      startup_timeout_s: 60.0
      move_timeout_s: 30.0

      # --- 工作关节（顺序 = q 索引顺序）
      joint_names: ["swing", "boom", "arm", "bucket"]
      # mock 后端用 deg；**接真 AGX 365 时**：AGX 是混合单位（回转 rad、三个液压缸
      # 是米），joint_units 必须留空，另用 swing_unit 声明回转单位——照抄下面：
      #
      #   joint_units: null          # 混合单位：不能撒谎成 deg/rad
      #   swing_unit: "rad"          # 漏了它 dig 会把角度当弧度发，第一帧就被限位拒
      #   joint_limits:              # 探针实测行程（--direct / --bridge）
      #     swing: [-3.14159, 3.14159]   # rad（模型本身无限位回转，这里按 ±π 收）
      #     boom: [-0.7, 0.4]            # m（ArmPrismatic1/2，双缸整组同步）
      #     arm: [-0.88, 0.8]            # m（StickPrismatic）
      #     bucket: [-1.0, 0.312]        # m（BucketPrismatic）
      #   home_joints:               # 原生单位；0 是行程中位（安全）
      #     swing: 0.0
      #     boom: 0.0
      #     arm: 0.0
      #     bucket: 0.0
      #   dig_cycle_tuning:          # 值 = 该关节原生单位（boom/arm/bucket 是**米**）
      #     ready_boom_deg: 0.10       # 键名沿用历史 *_deg，值是原生单位
      #     ready_arm_deg: -0.82
      #     ready_bucket_deg: -0.65
      #     dig_boom_deg: -0.25
      #     dig_arm_deg: 0.30
      #     dig_bucket_deg: -0.70
      #     curl_boom_deg: 0.02
      #     curl_arm_deg: 0.70
      #     curl_bucket_deg: 0.10
      #     dump_boom_deg: 0.38
      #     dump_arm_deg: -0.40
      #     dump_bucket_deg: -0.80
      #     bucket_volume_m3: 0.6
      #
      # （关键帧取自 AGX 官方 data/python/agxTerrain/excavator_365_terrain.agxpy 的
      #   digCycle，已收敛进实测行程内侧；改完先跑
      #   `agx_scene_probe.py --check-config <你的 config>` 过闸门。）
      joint_units: "deg"
      joint_limits:                # 接入 AGX 模型后按实测改
        swing: [-180.0, 180.0]
        boom: [-45.0, 60.0]
        arm: [-135.0, 60.0]
        bucket: [-160.0, 40.0]
      home_joints:                 # 安全收拢姿态（走行/转场）
        swing: 0.0
        boom: -20.0
        arm: 25.0
        bucket: 10.0

      # --- 履带底盘（motion.base：navigate_relative / rotate_base / drive_arc）
      has_base: true
      base_step_limits: [1.0, 0.7]   # 每命令 ≤1 m / ≤0.7 rad（SafetyRail 读取）

      # --- 地形真值（get_terrain）
      terrain_enabled: true
      # [仅 mock] 料堆真值；AGX 后端读仿真，忽略此项
      terrain_piles:
        - name: "soil_pile"
          x_m: -2.0
          y_m: 1.0
          volume_m3: 2.0

      # --- 挖掘工作参数
      reach_min_m: 1.0              # 铲齿可达半径包络（基座系，米）
      reach_max_m: 6.0
      # 关键帧微调（deg），键集见 work.DEFAULT_DIG_TUNING；只写要改的键
      # dig_cycle_tuning:
      #   dig_boom_deg: -40.0
      #   bucket_volume_m3: 0.8

      # --- 相机（阶段B：接 AGX 渲染帧 + 检测服务时打开）
      camera_enabled: false
      camera_resolution: [640, 480]

# 无 prompt/任务字段：任务不进 config，一律由 --query 或 --voice 在运行时给出。

model:
  provider: OpenAI
  api_base: "your own api"      # ← 填实验室 vLLM 端点或云 API 地址
  api_key: ""                   # 用 --api-key 覆盖
  model_name: "deepseek-ai/DeepSeek-V3.2"
  temperature: 0.3
  max_tokens: 2048

agent:
  log_level: INFO
  log_dir: ./logs
  exec_mode: fastagent           # 默认快路径；单步调试 --stepagent
  enable_skill: true
  # 快路径 LLM①（意图解析）的单次读超时，秒。推理型模型（glm-5 等）经常 20 s 以上
  # 才回：日志里出现 `[planner] attempt N/3 failed: The read operation timed out`
  # 就是这个太短，调大即可（默认 60；慢端点给 90~120）。
  intent_timeout_s: 60.0
